<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Noël – Accès spécial</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1f5f3b, #0b2e1a);
      font-family: "Georgia", serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 🎄 Carte centrale */
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 3px solid rgba(255, 215, 0, 0.4);
      border-radius: 25px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      position: relative;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
      letter-spacing: 2px;
      color: #ffd700;
    }

    p {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .code-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .prefix {
      opacity: 0.7;
      letter-spacing: 4px;
    }

    input {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #ffd700;
      border-radius: 10px;
      padding: 10px;
      width: 80px;
      font-size: 24px;
      text-align: center;
      color: #fff;
      letter-spacing: 4px;
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #c40000, #ff2e2e);
      border: none;
      color: white;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    .error {
      color: #ffb3b3;
      margin-top: 20px;
      display: none;
    }

    .wreath::after {
      content: "🎀";
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
    }

    /* ✨ Guirlande lumineuse */
    .lights {
      position: absolute;
      top: -20px;
      left: -20px;
      right: -20px;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
    }

    .bulb {
      width: 10px;
      height: 10px;
      background: gold;
      border-radius: 50%;
      box-shadow: 0 0 10px gold;
      animation: blink 2s infinite alternate;
    }

    .bulb:nth-child(2) { animation-delay: 0.4s; background: red; box-shadow: 0 0 10px red; }
    .bulb:nth-child(3) { animation-delay: 0.8s; background: lime; box-shadow: 0 0 10px lime; }
    .bulb:nth-child(4) { animation-delay: 1.2s; background: gold; }

    @keyframes blink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

  </style>
</head>
<body>

  <div class="card">

    <div class="lights">
      <div class="bulb"></div>
      <div class="bulb"></div>
      <div class="bulb"></div>
      <div class="bulb"></div>
      <div class="bulb"></div>
    </div>

    <div class="wreath"></div>

    <h1>Un Noël pas comme les autres</h1>
    <p>Certains souvenirs demandent d’être complétés…</p>

    <div class="code-wrapper">
      <span class="prefix">BCS</span>
      <input type="text" id="code" maxlength="2" placeholder="--">
    </div>

    <button onclick="verifierCode()">Continuer</button>

    <div class="error" id="erreur">
      Le code ne semble pas correct…
    </div>

  </div>

  <script>
    function verifierCode() {
      const suffixe = document.getElementById("code").value.toUpperCase();
      const codeComplet = "BCS" + suffixe;

      if (codeComplet === "BCSOC") {
        window.location.href = "2.html";
      } else {
        document.getElementById("erreur").style.display = "block";
      }
    }
  </script>

</body>
</html>
